name: Déploiement Infomaniak (FTPS)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "ftp-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement vers l'hébergement Infomaniak
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Vérification des secrets FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        if: env.FTP_SERVER == ''
        run: |
          echo "::warning title=Secrets FTP manquants::Les secrets FTP_SERVER, FTP_USERNAME ou FTP_PASSWORD ne sont pas encore configurés dans GitHub Secrets."
          echo "Pour activer la synchronisation automatique vers Infomaniak :"
          echo "1. Rendez-vous dans Settings > Secrets and variables > Actions"
          echo "2. Ajoutez FTP_SERVER, FTP_USERNAME et FTP_PASSWORD"

      - name: Synchronisation FTPS vers Infomaniak
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR || 'web/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            LICENSE
            scripts/**
